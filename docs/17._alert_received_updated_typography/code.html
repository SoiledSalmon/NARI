<style>
        .glass-panel {
            background: rgba(255, 218, 214, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .soft-shadow-crimson {
            box-shadow: 0 10px 30px -5px rgba(186, 26, 26, 0.15);
        }
        .pulse-bg {
            animation: pulse-soft 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: .7; }
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col antialiased selection:bg-tertiary selection:text-on-tertiary relative overflow-hidden">
<!-- Background Ambience (Crimson Tint for Alert) -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 bg-gradient-to-br from-error-container to-surface"></div>
<div class="absolute top-0 left-0 right-0 h-96 bg-gradient-to-b from-error-container/40 to-transparent z-0 pointer-events-none"></div>
<!-- Main Content Canvas (No Nav Shell as it's a focus/alert screen) -->
<main class="flex-grow z-10 flex flex-col px-margin-mobile py-xl md:px-margin-desktop max-w-4xl mx-auto w-full relative">
<!-- Alert Header -->
<header class="flex flex-col items-center text-center mb-lg pt-8">
<div class="w-24 h-24 rounded-full bg-error-container text-error flex items-center justify-center mb-md pulse-bg soft-shadow-crimson">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<h1 class="font-status-display text-status-display text-error mb-xs">SOS Alert</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Elena initiated a manual SOS.</p>
</header>
<!-- Location Card (Glassmorphism Bento) -->
<div class="glass-panel rounded-[24px] p-6 mb-lg flex flex-col gap-md soft-shadow-crimson relative overflow-hidden">
<!-- Map Placeholder -->
<div class="w-full h-48 bg-surface-container rounded-xl overflow-hidden relative" data-location="City Map" style="">
<img alt="Map Location" class="w-full h-full object-cover opacity-80" data-alt="A clean, minimalist digital map interface showing city streets in a soft, low-contrast light mode aesthetic. A subtle, glowing crimson marker indicates a specific location, adding a sense of gentle urgency without being jarring. The map colors are muted warm greys and soft creams, ensuring the interface feels calm and authoritative." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDjndw7_hmp5e4C4duAL7jfyqgI4js-K7LtOgNWOwasSRrsRkiX8btxRZG32GW1aGZDIhZD_KT54bbTja3qbAS4TWQAOi3YHM7yNJ9rB7xR_kfAQT_xP2nYqv27Pnq5FUaipjZ_vHP-w-QkXf7r3mCk390xdTf36ojj_S_QpG2Xf8N1V1X19bAVOjvW41ituqwlHZVbuWrybjmR65JFuM0gn4GijvD8XS4RZGG2Hv_vwGyt6ISlDNncr_FuY9vegb0ymvKQCJMtaPN-"/>
<!-- Overlay Marker -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="w-12 h-12 rounded-full bg-error/20 flex items-center justify-center pulse-bg">
<div class="w-4 h-4 rounded-full bg-error border-2 border-white shadow-sm"></div>
</div>
</div>
</div>
<!-- Location Details -->
<div class="flex justify-between items-end">
<div class="flex flex-col gap-1">
<span class="font-label-caps text-label-caps text-error">Current Location</span>
<span class="font-body-md text-body-md text-on-surface">1420 5th Ave, Seattle</span>
</div>
<div class="flex flex-col items-end gap-1">
<span class="font-label-caps text-label-caps text-on-surface-variant">Distance</span>
<span class="font-technical-sm text-technical-sm text-on-surface bg-surface-bright/50 px-3 py-1 rounded-full border border-outline-variant/30 backdrop-blur-sm">0.8 mi</span>
</div>
</div>
</div>
<!-- Sensor Readouts -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-md mb-xl">
<div class="bg-surface-container-low/50 backdrop-blur-md border border-outline-variant/20 rounded-xl p-4 flex flex-col items-center justify-center gap-2">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">battery_2_bar</span>
<span class="font-technical-sm text-technical-sm text-on-surface-variant">15%</span>
</div>
<div class="bg-surface-container-low/50 backdrop-blur-md border border-outline-variant/20 rounded-xl p-4 flex flex-col items-center justify-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">signal_cellular_alt</span>
<span class="font-technical-sm text-technical-sm text-on-surface-variant">Strong</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-4 mt-auto">
<button class="w-full bg-error text-on-error h-[56px] rounded-full font-headline-md text-headline-md flex items-center justify-center gap-2 shadow-sm hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">call</span>
                Call Elena
            </button>
<button class="w-full bg-surface-container-highest text-on-surface h-[56px] rounded-full font-headline-md text-headline-md flex items-center justify-center gap-2 hover:bg-surface-dim transition-colors border border-outline-variant/30">
<span class="material-symbols-outlined">directions</span>
                Navigate
            </button>
<button class="w-full bg-transparent text-on-surface-variant h-[56px] rounded-full font-body-md text-body-md flex items-center justify-center hover:text-on-surface transition-colors mt-2">
                I'm with them — mark safe
            </button>
</div>
