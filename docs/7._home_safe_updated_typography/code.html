<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NARI - Home Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&amp;family=Nunito+Sans:wght@400;700&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#2f1316",
                        "on-secondary-fixed-variant": "#1b4e4f",
                        "tertiary-fixed-dim": "#ebbabd",
                        "error": "#ba1a1a",
                        "surface-bright": "#fcf9f2",
                        "inverse-on-surface": "#f3f0ea",
                        "surface-dim": "#dcdad3",
                        "surface": "#fcf9f2",
                        "primary-fixed-dim": "#afd0a1",
                        "on-secondary": "#ffffff",
                        "surface-container": "#f0eee7",
                        "surface-variant": "#e5e2db",
                        "on-background": "#1c1c18",
                        "primary": "#334f2b",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f6f3ec",
                        "surface-tint": "#496640",
                        "secondary-container": "#baeced",
                        "surface-container-highest": "#e5e2db",
                        "inverse-primary": "#afd0a1",
                        "background": "#fcf9f2",
                        "on-secondary-container": "#3c6c6d",
                        "tertiary": "#613e41",
                        "on-surface-variant": "#434840",
                        "on-error": "#ffffff",
                        "primary-container": "#4a6741",
                        "outline-variant": "#c3c8bd",
                        "on-surface": "#1c1c18",
                        "secondary-fixed-dim": "#9ecfd0",
                        "on-primary-fixed": "#062104",
                        "tertiary-container": "#7b5558",
                        "inverse-surface": "#31312c",
                        "outline": "#73796f",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#603d40",
                        "tertiary-fixed": "#ffdadb",
                        "on-tertiary-container": "#ffced1",
                        "on-primary-fixed-variant": "#324e2a",
                        "on-primary-container": "#c2e4b4",
                        "secondary-fixed": "#baeced",
                        "surface-container-high": "#ebe8e1",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#caecbc",
                        "on-secondary-fixed": "#002021",
                        "on-error-container": "#93000a",
                        "secondary": "#366667",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "sm": "8px",
                        "md": "16px",
                        "xs": "4px",
                        "margin-desktop": "64px",
                        "lg": "24px",
                        "unit": "4px",
                        "gutter": "16px",
                        "xl": "40px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Nunito"],
                        "body-md": ["Nunito Sans"],
                        "headline-md": ["Nunito"],
                        "status-display": ["Nunito"],
                        "label-caps": ["Nunito Sans"],
                        "technical-sm": ["DM Mono"],
                        "body-lg": ["Nunito Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "status-display": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700"}],
                        "technical-sm": ["13px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Pulse Animation for Status */
        @keyframes gentle-pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .animate-gentle-pulse {
            animation: gentle-pulse 4s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased selection:bg-primary/20">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl border-b border-outline-variant/30 shadow-sm transition-all duration-300">
<div class="flex justify-between items-center px-margin-mobile h-16 w-full max-w-7xl mx-auto">
<!-- Leading Icon -->
<button aria-label="Shield" class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low transition-colors p-2 rounded-full flex items-center justify-center active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="shield_with_heart" data-weight="fill">shield_with_heart</span>
</button>
<!-- Headline/Brand -->
<h1 class="font-headline-lg text-headline-lg font-bold tracking-tighter text-on-surface dark:text-inverse-on-surface text-center flex-1">
                NARI
            </h1>
<!-- Trailing Icon -->
<div class="relative">
<button aria-label="Notifications" class="text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-low transition-colors p-2 rounded-full flex items-center justify-center active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<span class="absolute top-2 right-2 w-2 h-2 bg-primary rounded-full ring-2 ring-surface"></span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pt-24 pb-32 px-margin-mobile md:px-margin-desktop w-full max-w-7xl mx-auto space-y-xl">
<!-- Hero Status Card -->
<section class="relative w-full aspect-square md:aspect-[2/1] max-h-[400px] bg-primary-container rounded-3xl overflow-hidden shadow-[0_20px_40px_-10px_rgba(74,103,65,0.3)] flex flex-col items-center justify-center border border-white/20">
<!-- Glass Overlay -->
<div class="absolute inset-0 bg-gradient-to-b from-white/10 to-transparent backdrop-blur-[2px]"></div>
<!-- Animated Pulse Background -->
<div class="absolute w-3/4 h-3/4 bg-primary/30 rounded-full blur-3xl animate-gentle-pulse"></div>
<div class="relative z-10 flex flex-col items-center text-center space-y-md">
<div class="w-20 h-20 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/30 mb-sm shadow-inner">
<span class="material-symbols-outlined text-on-primary-container text-[40px]" data-icon="verified_user" data-weight="fill">verified_user</span>
</div>
<h2 class="font-status-display text-status-display text-on-primary-container">
                    You're Safe
                </h2>
<p class="font-body-lg text-body-lg text-on-primary-container/80 max-w-[250px]">
                    All sensors are active and monitoring your environment.
                </p>
</div>
<!-- Technical Readouts -->
<div class="absolute bottom-6 left-0 w-full flex justify-center gap-xs z-10">
<div class="bg-black/20 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-secondary-fixed"></span>
<span class="font-technical-sm text-technical-sm text-on-primary-container">GPS</span>
</div>
<div class="bg-black/20 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-secondary-fixed"></span>
<span class="font-technical-sm text-technical-sm text-on-primary-container">BLE</span>
</div>
<div class="bg-black/20 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-secondary-fixed"></span>
<span class="font-technical-sm text-technical-sm text-on-primary-container">NET</span>
</div>
</div>
</section>
<!-- Bento Grid for Actions & Info -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Start Journey Mode Card -->
<button class="group relative w-full text-left bg-surface-container-lowest rounded-2xl p-lg border border-outline-variant/50 shadow-[0_8px_24px_-8px_rgba(0,0,0,0.05)] hover:shadow-[0_12px_32px_-8px_rgba(0,0,0,0.1)] transition-all duration-300 overflow-hidden flex items-center justify-between">
<div class="absolute top-0 right-0 w-32 h-32 bg-secondary-container/30 rounded-bl-full -mr-10 -mt-10 transition-transform group-hover:scale-110 duration-500"></div>
<div class="relative z-10 space-y-sm">
<div class="w-12 h-12 bg-secondary-container rounded-full flex items-center justify-center text-on-secondary-container mb-md">
<span class="material-symbols-outlined" data-icon="directions_run" data-weight="fill">directions_run</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface">Start Journey Mode</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Active tracking with trusted contacts.</p>
</div>
<div class="relative z-10 w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</div>
</button>
<!-- Recent Alerts Widget -->
<div class="bg-surface-container-lowest rounded-2xl p-lg border border-outline-variant/50 shadow-[0_8px_24px_-8px_rgba(0,0,0,0.05)] flex flex-col space-y-md">
<div class="flex justify-between items-center">
<h3 class="font-headline-md text-[20px] leading-[28px] font-semibold text-on-surface">Recent Alerts</h3>
<button class="text-primary font-label-caps text-label-caps hover:underline">VIEW ALL</button>
</div>
<div class="flex-1 flex flex-col justify-center space-y-sm">
<!-- Empty State / Clean State -->
<div class="flex items-center gap-md p-md bg-surface-container-low rounded-xl">
<div class="w-10 h-10 bg-surface rounded-full flex items-center justify-center text-on-surface-variant border border-outline-variant/30">
<span class="material-symbols-outlined text-[20px]" data-icon="history">history</span>
</div>
<div>
<p class="font-body-md text-[15px] font-medium text-on-surface">No recent alerts</p>
<p class="font-body-md text-[13px] text-on-surface-variant">Your environment is clear.</p>
</div>
</div>
</div>
</div>
</section>
</main>
<!-- Floating Action Button (SOS) -->
<div class="fixed bottom-24 right-margin-mobile md:right-margin-desktop z-40">
<button class="relative group w-16 h-16 bg-error rounded-full shadow-[0_10px_30px_-5px_rgba(186,26,26,0.4)] flex items-center justify-center text-on-error hover:scale-105 active:scale-95 transition-all duration-300">
<!-- Outer Pulse Ring -->
<div class="absolute inset-0 rounded-full border-2 border-error/50 scale-110 opacity-0 group-hover:animate-[ping_1.5s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
<span class="font-label-caps text-[16px] tracking-widest font-bold">SOS</span>
</button>
</div>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 flex justify-around items-end pb-4 px-2 bg-surface-container dark:bg-surface-container-highest backdrop-blur-2xl rounded-t-xl shadow-[0_-10px_30px_-5px_rgba(74,103,65,0.15)] border-t-0 bg-surface-container/90 dark:bg-surface-container-highest/90">
<!-- Active Tab: Home -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full p-2 w-16 h-16 transform scale-90 duration-300 hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home" data-weight="fill">home</span>
<span class="font-label-caps text-[10px] leading-[10px] font-bold tracking-[0.05em]">Home</span>
</a>
<!-- Inactive Tabs -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-2 w-16 h-16 hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined mb-1" data-icon="health_metrics">health_metrics</span>
<span class="font-label-caps text-[10px] leading-[10px] font-bold tracking-[0.05em]">Status</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-2 w-16 h-16 hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined mb-1" data-icon="emergency_share">emergency_share</span>
<span class="font-label-caps text-[10px] leading-[10px] font-bold tracking-[0.05em]">SOS</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-2 w-16 h-16 hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined mb-1" data-icon="map">map</span>
<span class="font-label-caps text-[10px] leading-[10px] font-bold tracking-[0.05em]">Map</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-2 w-16 h-16 hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-label-caps text-[10px] leading-[10px] font-bold tracking-[0.05em]">Settings</span>
</a>
</nav>
</body></html>
