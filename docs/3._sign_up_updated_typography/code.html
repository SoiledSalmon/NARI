<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NARI - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&amp;family=Nunito+Sans:wght@400;700&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#2f1316",
                        "on-secondary-fixed-variant": "#1b4e4f",
                        "tertiary-fixed-dim": "#ebbabd",
                        "error": "#ba1a1a",
                        "surface-bright": "#fcf9f2",
                        "inverse-on-surface": "#f3f0ea",
                        "surface-dim": "#dcdad3",
                        "surface": "#fcf9f2",
                        "primary-fixed-dim": "#afd0a1",
                        "on-secondary": "#ffffff",
                        "surface-container": "#f0eee7",
                        "surface-variant": "#e5e2db",
                        "on-background": "#1c1c18",
                        "primary": "#334f2b",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f6f3ec",
                        "surface-tint": "#496640",
                        "secondary-container": "#baeced",
                        "surface-container-highest": "#e5e2db",
                        "inverse-primary": "#afd0a1",
                        "background": "#fcf9f2",
                        "on-secondary-container": "#3c6c6d",
                        "tertiary": "#613e41",
                        "on-surface-variant": "#434840",
                        "on-error": "#ffffff",
                        "primary-container": "#4a6741",
                        "outline-variant": "#c3c8bd",
                        "on-surface": "#1c1c18",
                        "secondary-fixed-dim": "#9ecfd0",
                        "on-primary-fixed": "#062104",
                        "tertiary-container": "#7b5558",
                        "inverse-surface": "#31312c",
                        "outline": "#73796f",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#603d40",
                        "tertiary-fixed": "#ffdadb",
                        "on-tertiary-container": "#ffced1",
                        "on-primary-fixed-variant": "#324e2a",
                        "on-primary-container": "#c2e4b4",
                        "secondary-fixed": "#baeced",
                        "surface-container-high": "#ebe8e1",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#caecbc",
                        "on-secondary-fixed": "#002021",
                        "on-error-container": "#93000a",
                        "secondary": "#366667",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "sm": "8px",
                        "md": "16px",
                        "xs": "4px",
                        "margin-desktop": "64px",
                        "lg": "24px",
                        "unit": "4px",
                        "gutter": "16px",
                        "xl": "40px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Nunito", "sans-serif"],
                        "body-md": ["Nunito Sans", "sans-serif"],
                        "headline-md": ["Nunito", "sans-serif"],
                        "status-display": ["Nunito", "sans-serif"],
                        "label-caps": ["Nunito Sans", "sans-serif"],
                        "technical-sm": ["DM Mono", "monospace"],
                        "body-lg": ["Nunito Sans", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "status-display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "technical-sm": ["13px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fcf9f2; /* surface-bright */
            color: #1c1c18; /* on-surface */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar (Transactional - Hidden Nav, Keep Brand/Back) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30 shadow-sm flex justify-between items-center px-margin-mobile h-16 max-w-7xl mx-auto text-primary">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-headline-lg text-headline-lg font-bold tracking-tighter text-on-surface">NARI</div>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow flex flex-col pt-24 px-margin-mobile max-w-lg mx-auto w-full">
<div class="mb-xl text-center md:text-left mt-8">
<h1 class="font-status-display text-status-display text-on-surface mb-sm">Sign Up</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">We'll send you a one-time code.</p>
</div>
<!-- Phone Input Container -->
<div class="bg-surface-container-low rounded-xl p-md border border-outline-variant/50 shadow-[0_4px_20px_-5px_rgba(74,103,65,0.05)] mb-auto relative overflow-hidden">
<!-- Soft inset shadow effect -->
<div class="absolute inset-0 shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)] pointer-events-none rounded-xl"></div>
<label class="font-label-caps text-label-caps text-on-surface-variant mb-xs block" for="phone-input">Mobile Number</label>
<div class="flex items-center mt-2">
<div class="flex items-center gap-2 pr-md border-r border-outline-variant/50">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">+91</span>
</div>
<input class="w-full bg-transparent border-none focus:ring-0 font-status-display text-[32px] leading-tight text-on-surface placeholder-outline-variant tracking-wider ml-md" id="phone-input" placeholder="00000 00000" readonly="" type="tel" value=""/>
</div>
</div>
<!-- Spacer to push Numpad down -->
<div class="flex-grow min-h-[40px]"></div>
<!-- Numpad & CTA Area -->
<div class="mt-auto pb-8 pt-4">
<!-- Soft Numpad -->
<div class="grid grid-cols-3 gap-y-6 gap-x-4 mb-xl max-w-[300px] mx-auto">
<button class="h-16 flex items-center justify-center font-status-display text-headline-lg text-on-surface active:bg-surface-container rounded-full transition-colors">1</button>
<button class="h-16 flex items-center justify-center font-status-display text-headline-lg text-on-surface active:bg-surface-container rounded-full transition-colors">2</button>
<button class="h-16 flex items-center justify-center font-status-display text-headline-lg text-on-surface active:bg-surface-container rounded-full transition-colors">3</button>
<button class="h-16 flex items-center justify-center font-status-display text-headline-lg text-on-surface active:bg-surface-container rounded-full transition-colors">4</button>
<button class="h-16 flex items-center justify-center font-status-display text-headline-lg text-on-surface active:bg-surface-container rounded-full transition-colors">5</button>
<button class="h-16 flex items-center justify-center font-status-display text-headline-lg text-on-surface active:bg-surface-container rounded-full transition-colors">6</button>
<button class="h-16 flex items-center justify-center font-status-display text-headline-lg text-on-surface active:bg-surface-container rounded-full transition-colors">7</button>
<button class="h-16 flex items-center justify-center font-status-display text-headline-lg text-on-surface active:bg-surface-container rounded-full transition-colors">8</button>
<button class="h-16 flex items-center justify-center font-status-display text-headline-lg text-on-surface active:bg-surface-container rounded-full transition-colors">9</button>
<div class="h-16"></div> <!-- Empty space -->
<button class="h-16 flex items-center justify-center font-status-display text-headline-lg text-on-surface active:bg-surface-container rounded-full transition-colors">0</button>
<button class="h-16 flex items-center justify-center text-on-surface-variant active:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined text-[32px]" data-icon="backspace">backspace</span>
</button>
</div>
<!-- CTA Button -->
<button class="w-full min-h-[56px] bg-primary text-on-primary font-headline-md text-headline-md rounded-full shadow-[0_10px_30px_-5px_rgba(74,103,65,0.3)] hover:opacity-90 transition-opacity active:scale-[0.98]">
                Continue
            </button>
<p class="text-center font-body-md text-body-md text-on-surface-variant mt-md text-sm">
                By continuing, you agree to our Terms &amp; Privacy Policy.
            </p>
</div>
</main>
<!-- Navigation Suppressed for Transactional Screen -->
</body></html>
