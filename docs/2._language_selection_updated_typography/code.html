<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NARI - Language Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&amp;family=Nunito+Sans:wght@400;700&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#2f1316",
                        "on-secondary-fixed-variant": "#1b4e4f",
                        "tertiary-fixed-dim": "#ebbabd",
                        "error": "#ba1a1a",
                        "surface-bright": "#fcf9f2",
                        "inverse-on-surface": "#f3f0ea",
                        "surface-dim": "#dcdad3",
                        "surface": "#fcf9f2",
                        "primary-fixed-dim": "#afd0a1",
                        "on-secondary": "#ffffff",
                        "surface-container": "#f0eee7",
                        "surface-variant": "#e5e2db",
                        "on-background": "#1c1c18",
                        "primary": "#334f2b",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f6f3ec",
                        "surface-tint": "#496640",
                        "secondary-container": "#baeced",
                        "surface-container-highest": "#e5e2db",
                        "inverse-primary": "#afd0a1",
                        "background": "#fcf9f2",
                        "on-secondary-container": "#3c6c6d",
                        "tertiary": "#613e41",
                        "on-surface-variant": "#434840",
                        "on-error": "#ffffff",
                        "primary-container": "#4a6741",
                        "outline-variant": "#c3c8bd",
                        "on-surface": "#1c1c18",
                        "secondary-fixed-dim": "#9ecfd0",
                        "on-primary-fixed": "#062104",
                        "tertiary-container": "#7b5558",
                        "inverse-surface": "#31312c",
                        "outline": "#73796f",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#603d40",
                        "tertiary-fixed": "#ffdadb",
                        "on-tertiary-container": "#ffced1",
                        "on-primary-fixed-variant": "#324e2a",
                        "on-primary-container": "#c2e4b4",
                        "secondary-fixed": "#baeced",
                        "surface-container-high": "#ebe8e1",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#caecbc",
                        "on-secondary-fixed": "#002021",
                        "on-error-container": "#93000a",
                        "secondary": "#366667",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "card": "20px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "sm": "8px",
                        "md": "16px",
                        "xs": "4px",
                        "margin-desktop": "64px",
                        "lg": "24px",
                        "unit": "4px",
                        "gutter": "16px",
                        "xl": "40px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Nunito", "sans-serif"],
                        "body-md": ["Nunito Sans", "sans-serif"],
                        "headline-md": ["Nunito", "sans-serif"],
                        "status-display": ["Nunito", "sans-serif"],
                        "label-caps": ["Nunito Sans", "sans-serif"],
                        "technical-sm": ["DM Mono", "monospace"],
                        "body-lg": ["Nunito Sans", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "status-display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "technical-sm": ["13px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px -5px rgba(74, 103, 65, 0.05), inset 1px 1px 0px rgba(255, 255, 255, 0.5);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 15px 35px -5px rgba(74, 103, 65, 0.08), inset 1px 1px 0px rgba(255, 255, 255, 0.6);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto px-margin-mobile flex flex-col items-center flex-grow justify-center py-xl relative z-10">
<!-- Header Section -->
<header class="text-center mb-xl w-full flex flex-col items-center space-y-md">
<!-- NARI Logo Representation (Text as requested, matching brand feel) -->
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tighter">NARI</h1>
<div class="space-y-xs text-center">
<h2 class="font-body-lg text-body-lg text-on-surface-variant">Choose your language</h2>
<h2 class="font-body-lg text-body-lg text-on-surface-variant opacity-80">ನಿಮ್ಮ ಭಾಷೆ ಆಯ್ಕೆ ಮಾಡಿ</h2>
</div>
</header>
<!-- Language Selection Cards -->
<div class="w-full space-y-lg flex flex-col items-stretch">
<!-- English Option -->
<button aria-label="Select English language" class="glass-card rounded-card p-lg flex items-center justify-between group transition-all duration-300 ease-in-out w-full text-left">
<div class="flex items-center space-x-md">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary group-hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined font-label-caps text-label-caps" style="font-variation-settings: 'FILL' 1;">language</span>
</div>
<div>
<span class="block font-headline-md text-headline-md text-on-surface">English</span>
<span class="block font-body-md text-body-md text-on-surface-variant mt-xs">United States / UK</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Kannada Option -->
<button aria-label="ಕನ್ನಡ ಭಾಷೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ" class="glass-card rounded-card p-lg flex items-center justify-between group transition-all duration-300 ease-in-out w-full text-left">
<div class="flex items-center space-x-md">
<div class="w-12 h-12 rounded-full bg-secondary/10 flex items-center justify-center text-secondary group-hover:bg-secondary/20 transition-colors">
<span class="material-symbols-outlined font-label-caps text-label-caps" style="font-variation-settings: 'FILL' 1;">translate</span>
</div>
<div>
<span class="block font-headline-md text-headline-md text-on-surface">ಕನ್ನಡ</span>
<span class="block font-body-md text-body-md text-on-surface-variant mt-xs">Karnataka, India</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-secondary transition-colors">chevron_right</span>
</button>
</div>
<!-- Decorative Subtle Background Element to enhance depth without clutter -->
<div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-fixed-dim/20 blur-[100px] pointer-events-none -z-10"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-secondary-container/20 blur-[120px] pointer-events-none -z-10"></div>
</main>
</body></html>
