<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Contacts - NARI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&amp;family=Nunito+Sans:wght@400;700&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#2f1316",
                        "on-secondary-fixed-variant": "#1b4e4f",
                        "tertiary-fixed-dim": "#ebbabd",
                        "error": "#ba1a1a",
                        "surface-bright": "#fcf9f2",
                        "inverse-on-surface": "#f3f0ea",
                        "surface-dim": "#dcdad3",
                        "surface": "#fcf9f2",
                        "primary-fixed-dim": "#afd0a1",
                        "on-secondary": "#ffffff",
                        "surface-container": "#f0eee7",
                        "surface-variant": "#e5e2db",
                        "on-background": "#1c1c18",
                        "primary": "#334f2b",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f6f3ec",
                        "surface-tint": "#496640",
                        "secondary-container": "#baeced",
                        "surface-container-highest": "#e5e2db",
                        "inverse-primary": "#afd0a1",
                        "background": "#fcf9f2",
                        "on-secondary-container": "#3c6c6d",
                        "tertiary": "#613e41",
                        "on-surface-variant": "#434840",
                        "on-error": "#ffffff",
                        "primary-container": "#4a6741",
                        "outline-variant": "#c3c8bd",
                        "on-surface": "#1c1c18",
                        "secondary-fixed-dim": "#9ecfd0",
                        "on-primary-fixed": "#062104",
                        "tertiary-container": "#7b5558",
                        "inverse-surface": "#31312c",
                        "outline": "#73796f",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#603d40",
                        "tertiary-fixed": "#ffdadb",
                        "on-tertiary-container": "#ffced1",
                        "on-primary-fixed-variant": "#324e2a",
                        "on-primary-container": "#c2e4b4",
                        "secondary-fixed": "#baeced",
                        "surface-container-high": "#ebe8e1",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#caecbc",
                        "on-secondary-fixed": "#002021",
                        "on-error-container": "#93000a",
                        "secondary": "#366667",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "sm": "8px",
                        "md": "16px",
                        "xs": "4px",
                        "margin-desktop": "64px",
                        "lg": "24px",
                        "unit": "4px",
                        "gutter": "16px",
                        "xl": "40px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Nunito", "sans-serif"],
                        "body-md": ["Nunito Sans", "sans-serif"],
                        "headline-md": ["Nunito", "sans-serif"],
                        "status-display": ["Nunito", "sans-serif"],
                        "label-caps": ["Nunito Sans", "sans-serif"],
                        "technical-sm": ["DM Mono", "monospace"],
                        "body-lg": ["Nunito Sans", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "status-display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700" }],

                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]

                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        h1, h2, h3, .font-headline-lg, .font-headline-md {
            font-family: 'Nunito', sans-serif;
        }
        .font-label-caps {
            font-family: 'Nunito Sans', sans-serif;
            text-transform: uppercase;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-start pb-24 md:pb-0 pt-16 md:pt-24 relative overflow-x-hidden">
<!-- Intent: Onboarding/Setup - Suppression of Nav Shell -->
<main class="w-full max-w-[600px] px-margin-mobile flex flex-col gap-lg flex-1 relative z-10">
<!-- Header Section -->
<header class="flex flex-col gap-xs pt-lg text-center md:text-left">
<h1 class="font-headline-lg text-headline-lg text-primary">Add Contacts</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Add at least one person you trust.</p>
</header>
<!-- Add Contact Action -->
<button class="w-full flex items-center justify-center gap-sm py-4 bg-surface-container-high rounded-full hover:bg-surface-variant transition-colors border border-outline-variant/30 text-primary">
<span class="material-symbols-outlined text-[24px]">person_add</span>
<span class="font-body-lg text-body-lg font-bold">Add New Contact</span>
</button>
<!-- Contact List (Bento-ish Rows) -->
<section class="flex flex-col gap-md mt-md w-full">
<!-- Contact Row 1 (NARI User) -->
<div class="flex items-center justify-between p-md bg-surface/60 backdrop-blur-xl rounded-[20px] shadow-[0_10px_30px_-5px_rgba(74,103,65,0.08)] border border-white hover:bg-surface-container-lowest transition-colors group">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container font-headline-md text-headline-md">
                        M
                    </div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg font-bold text-on-surface group-hover:text-primary transition-colors">Maria Garcia</span>
<span class="font-body-md text-body-md text-on-surface-variant">Sister</span>
</div>
</div>
<div class="flex flex-col items-end gap-xs">
<!-- NARI Badge -->
<div class="px-3 py-1 rounded-full bg-primary-container/30 text-primary-container border border-primary/20 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] icon-fill text-primary">shield_with_heart</span>
<span class="font-label-caps text-label-caps text-primary">NARI</span>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors p-1">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</div>
<!-- Contact Row 2 (SMS Only) -->
<div class="flex items-center justify-between p-md bg-surface/60 backdrop-blur-xl rounded-[20px] shadow-[0_10px_30px_-5px_rgba(74,103,65,0.08)] border border-white hover:bg-surface-container-lowest transition-colors group">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant font-headline-md text-headline-md">
                        D
                    </div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg font-bold text-on-surface group-hover:text-primary transition-colors">David Chen</span>
<span class="font-body-md text-body-md text-on-surface-variant">Partner</span>
</div>
</div>
<div class="flex flex-col items-end gap-xs">
<!-- SMS Badge -->
<div class="px-3 py-1 rounded-full bg-surface-variant text-on-surface-variant border border-outline-variant/50 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">sms</span>
<span class="font-label-caps text-label-caps">SMS</span>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors p-1">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</div>
<!-- Empty State / Placeholder (Optional - shown for completeness) -->
<div class="flex flex-col items-center justify-center p-xl border-2 border-dashed border-outline-variant/30 rounded-[20px] text-center gap-sm mt-sm hidden">
<span class="material-symbols-outlined text-[48px] text-outline-variant/50">group</span>
<p class="font-body-md text-body-md text-on-surface-variant">Your emergency contacts will appear here.</p>
</div>
</section>
<!-- Bottom Actions (Sticky-ish) -->
<div class="mt-auto pt-xl w-full pb-margin-mobile">
<button class="w-full min-h-[56px] bg-primary text-on-primary rounded-full font-body-lg text-body-lg font-bold hover:bg-primary/90 transition-colors shadow-[0_10px_30px_-5px_rgba(51,79,43,0.3)]">
                Continue
            </button>
</div>
</main>
<!-- Ambient Background Elements to match Soft Humanist aesthetic -->
<div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-fixed/20 rounded-full blur-[100px] -z-10 pointer-events-none"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-secondary-fixed/10 rounded-full blur-[120px] -z-10 pointer-events-none"></div>
</body></html>
