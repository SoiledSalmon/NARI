<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NARI - OTP Verification</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&amp;family=Nunito+Sans:wght@400;700&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#2f1316",
                        "on-secondary-fixed-variant": "#1b4e4f",
                        "tertiary-fixed-dim": "#ebbabd",
                        "error": "#ba1a1a",
                        "surface-bright": "#fcf9f2",
                        "inverse-on-surface": "#f3f0ea",
                        "surface-dim": "#dcdad3",
                        "surface": "#fcf9f2",
                        "primary-fixed-dim": "#afd0a1",
                        "on-secondary": "#ffffff",
                        "surface-container": "#f0eee7",
                        "surface-variant": "#e5e2db",
                        "on-background": "#1c1c18",
                        "primary": "#334f2b",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f6f3ec",
                        "surface-tint": "#496640",
                        "secondary-container": "#baeced",
                        "surface-container-highest": "#e5e2db",
                        "inverse-primary": "#afd0a1",
                        "background": "#fcf9f2",
                        "on-secondary-container": "#3c6c6d",
                        "tertiary": "#613e41",
                        "on-surface-variant": "#434840",
                        "on-error": "#ffffff",
                        "primary-container": "#4a6741",
                        "outline-variant": "#c3c8bd",
                        "on-surface": "#1c1c18",
                        "secondary-fixed-dim": "#9ecfd0",
                        "on-primary-fixed": "#062104",
                        "tertiary-container": "#7b5558",
                        "inverse-surface": "#31312c",
                        "outline": "#73796f",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#603d40",
                        "tertiary-fixed": "#ffdadb",
                        "on-tertiary-container": "#ffced1",
                        "on-primary-fixed-variant": "#324e2a",
                        "on-primary-container": "#c2e4b4",
                        "secondary-fixed": "#baeced",
                        "surface-container-high": "#ebe8e1",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#caecbc",
                        "on-secondary-fixed": "#002021",
                        "on-error-container": "#93000a",
                        "secondary": "#366667",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "sm": "8px",
                        "md": "16px",
                        "xs": "4px",
                        "margin-desktop": "64px",
                        "lg": "24px",
                        "unit": "4px",
                        "gutter": "16px",
                        "xl": "40px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Nunito", "sans-serif"],
                        "body-md": ["Nunito Sans", "sans-serif"],
                        "headline-md": ["Nunito", "sans-serif"],
                        "status-display": ["Nunito", "sans-serif"],
                        "label-caps": ["Nunito Sans", "sans-serif"],
                        "technical-sm": ["DM Mono", "monospace"],
                        "body-lg": ["Nunito Sans", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "status-display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "technical-sm": ["13px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(252, 249, 242, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -5px rgba(74, 103, 65, 0.08);
        }
        .otp-input:focus {
            box-shadow: 0 0 0 2px #496640;
            border-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Transactional Screen: Navigation Suppressed -->
<header class="w-full flex items-center justify-between p-margin-mobile absolute top-0 z-10">
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold tracking-tighter text-on-surface">NARI</div>
<div class="w-10"></div> <!-- Balancer for flex -->
</header>
<main class="flex-grow flex flex-col justify-center items-center p-margin-mobile w-full max-w-md mx-auto pt-24 pb-12">
<div class="glass-panel w-full p-8 rounded-xl flex flex-col items-center text-center">
<div class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center mb-6 shadow-sm">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Verify it's you</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-8 px-4">
                Enter the code sent to your mobile.
            </p>
<!-- OTP Input Group -->
<div class="flex gap-2 sm:gap-3 justify-center w-full mb-8" dir="ltr">
<input aria-label="Digit 1" class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center font-status-display text-status-display bg-surface border border-outline-variant/30 rounded-lg text-on-surface focus:outline-none transition-shadow" maxlength="1" placeholder="·" type="text"/>
<input aria-label="Digit 2" class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center font-status-display text-status-display bg-surface border border-outline-variant/30 rounded-lg text-on-surface focus:outline-none transition-shadow" maxlength="1" placeholder="·" type="text"/>
<input aria-label="Digit 3" class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center font-status-display text-status-display bg-surface border border-outline-variant/30 rounded-lg text-on-surface focus:outline-none transition-shadow" maxlength="1" placeholder="·" type="text"/>
<input aria-label="Digit 4" class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center font-status-display text-status-display bg-surface border border-outline-variant/30 rounded-lg text-on-surface focus:outline-none transition-shadow" maxlength="1" placeholder="·" type="text"/>
<input aria-label="Digit 5" class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center font-status-display text-status-display bg-surface border border-outline-variant/30 rounded-lg text-on-surface focus:outline-none transition-shadow" maxlength="1" placeholder="·" type="text"/>
<input aria-label="Digit 6" class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center font-status-display text-status-display bg-surface border border-outline-variant/30 rounded-lg text-on-surface focus:outline-none transition-shadow" maxlength="1" placeholder="·" type="text"/>
</div>
<!-- Resend Timer -->
<div class="flex items-center gap-2 mb-8 text-on-surface-variant">
<span class="font-body-md text-body-md">Resend code in</span>
<span class="font-technical-sm text-technical-sm bg-surface-container px-2 py-1 rounded">00:30</span>
</div>
<!-- Primary Action -->
<button class="w-full min-h-[56px] bg-primary text-on-primary rounded-full font-headline-md text-headline-md hover:bg-surface-tint transition-colors shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                Verify
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</main>
</body></html>
