<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SOS Countdown</title>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&amp;family=Nunito+Sans:wght@400;700&amp;family=Nunito:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-fixed": "#2f1316",
                        "on-secondary-fixed-variant": "#1b4e4f",
                        "tertiary-fixed-dim": "#ebbabd",
                        "error": "#ba1a1a",
                        "surface-bright": "#fcf9f2",
                        "inverse-on-surface": "#f3f0ea",
                        "surface-dim": "#dcdad3",
                        "surface": "#fcf9f2",
                        "primary-fixed-dim": "#afd0a1",
                        "on-secondary": "#ffffff",
                        "surface-container": "#f0eee7",
                        "surface-variant": "#e5e2db",
                        "on-background": "#1c1c18",
                        "primary": "#334f2b",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f6f3ec",
                        "surface-tint": "#496640",
                        "secondary-container": "#baeced",
                        "surface-container-highest": "#e5e2db",
                        "inverse-primary": "#afd0a1",
                        "background": "#fcf9f2",
                        "on-secondary-container": "#3c6c6d",
                        "tertiary": "#613e41",
                        "on-surface-variant": "#434840",
                        "on-error": "#ffffff",
                        "primary-container": "#4a6741",
                        "outline-variant": "#c3c8bd",
                        "on-surface": "#1c1c18",
                        "secondary-fixed-dim": "#9ecfd0",
                        "on-primary-fixed": "#062104",
                        "tertiary-container": "#7b5558",
                        "inverse-surface": "#31312c",
                        "outline": "#73796f",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#603d40",
                        "tertiary-fixed": "#ffdadb",
                        "on-tertiary-container": "#ffced1",
                        "on-primary-fixed-variant": "#324e2a",
                        "on-primary-container": "#c2e4b4",
                        "secondary-fixed": "#baeced",
                        "surface-container-high": "#ebe8e1",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#caecbc",
                        "on-secondary-fixed": "#002021",
                        "on-error-container": "#93000a",
                        "secondary": "#366667",
                        "on-primary": "#ffffff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "margin-mobile": "20px",
                        "sm": "8px",
                        "md": "16px",
                        "xs": "4px",
                        "margin-desktop": "64px",
                        "lg": "24px",
                        "unit": "4px",
                        "gutter": "16px",
                        "xl": "40px"
                    },
                    fontFamily: {
                        "headline-lg": ["Nunito", "sans-serif"],
                        "body-md": ["Nunito Sans", "sans-serif"],
                        "headline-md": ["Nunito", "sans-serif"],
                        "status-display": ["Nunito", "sans-serif"],
                        "label-caps": ["Nunito Sans", "sans-serif"],
                        "technical-sm": ["DM Mono", "monospace"],
                        "body-lg": ["Nunito Sans", "sans-serif"]
                    },
                    fontSize: {
                        "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "600" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "status-display": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.1em", fontWeight: "700" }],
                        "technical-sm": ["13px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-tertiary text-on-tertiary min-h-screen w-full flex flex-col items-center justify-center p-margin-mobile relative overflow-hidden font-body-md antialiased selection:bg-tertiary-fixed selection:text-on-tertiary-fixed">
<!-- Ambient Implied Pulse Background -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center">
<div class="w-[120vw] h-[120vw] rounded-full bg-gradient-radial from-tertiary-container/40 to-transparent blur-3xl opacity-60"></div>
</div>
<!-- Main Content Canvas -->
<main class="z-10 flex flex-col items-center w-full max-w-lg mx-auto">
<!-- Header Text -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-on-tertiary mb-sm tracking-tight">SOS Initiated</h1>
<p class="font-body-lg text-body-lg text-on-tertiary/80">Notifying emergency contacts</p>
</div>
<!-- Central Countdown Ring -->
<div class="relative flex items-center justify-center my-xl">
<!-- Background Track -->
<div class="absolute w-64 h-64 rounded-full border-4 border-on-tertiary/10"></div>
<!-- Implied Progress Ring (Visual styling for the takeover) -->
<div class="absolute w-64 h-64 rounded-full border-4 border-on-tertiary opacity-90 shadow-[0_0_40px_rgba(255,255,255,0.2)]"></div>
<!-- Soft inner glow -->
<div class="absolute inset-4 rounded-full bg-on-tertiary/5 blur-xl"></div>
<!-- The Countdown Number -->
<div class="relative z-10 flex items-center justify-center w-48 h-48 bg-tertiary-container/30 backdrop-blur-md rounded-full shadow-inner border border-on-tertiary/20">
<span class="font-status-display text-status-display text-on-tertiary drop-shadow-md" style="font-size: 80px; line-height: 1;">5</span>
</div>
</div>
<!-- Action Area -->
<div class="mt-xl pt-lg w-full flex justify-center">
<button class="flex items-center justify-center gap-sm px-xl py-lg rounded-full border-2 border-on-tertiary text-on-tertiary hover:bg-on-tertiary/10 hover:border-on-tertiary/80 transition-all duration-300 ease-in-out backdrop-blur-sm group">
<span class="material-symbols-outlined text-on-tertiary group-hover:scale-110 transition-transform duration-300" style="font-variation-settings: 'FILL' 0;">
                    health_metrics
                </span>
<span class="font-headline-md text-headline-md tracking-wide">I'm Safe</span>
</button>
</div>
</main>
</body></html>
